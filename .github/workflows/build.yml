name: Tests

# Tests and an app build on every PR. The signed app and its disk image are built by release.yml
# (when a release/<version> pull request is merged and v<version> is tagged) or, once
# NOTCHLING_RELEASES is on, by beta.yml (built, then signed in a separate job).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:  # the job id is the check name main requires; it only runs the tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run tests
        run: swift test

  app-build:  # build.sh compiles arm64 and x86_64 and joins them
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the app
        run: ./build.sh
