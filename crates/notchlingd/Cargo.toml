[package]
name = "notchling-notchlingd"
description = "Notchling notchlingd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# One binary, `notchling`: `daemon` serves, the other subcommands are its clients.
[[bin]]
name = "notchling"
path = "src/main.rs"

[dependencies]
serde_json = "1"
notchling-engine = { path = "../engine" }
notchling-local-api = { path = "../local-api" }
notchling-platform = { path = "../platform" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
