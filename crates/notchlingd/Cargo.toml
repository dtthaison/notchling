[package]
name = "notchling-notchlingd"
description = "Notchling notchlingd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# One binary, `notchling`: `daemon` serves, the other subcommands are its clients.
[[bin]]
name = "notchling"
path = "src/main.rs"

[dependencies]
serde_json = "1"
notchling-engine = { path = "../engine" }
notchling-local-api = { path = "../local-api" }
notchling-platform = { path = "../platform" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A test certificate in the Swift app's PKCS#12 layout, for the bridge ops' tests.
[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
p12 = "0.6.3"
# A stand-in for Antigravity's summaries database (agy_ops tests); the engine reads it the same way.
rusqlite = { version = "0.41.1", features = ["bundled"] }
