name: phone

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/phone.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/phone.yml"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  phone-analyze:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Placeholder assets (git-ignored; analyze and tests only need the paths)
        run: |
          mkdir -p assets/viz/vendor assets/viz/fonts assets/models
          touch assets/models/ggml-small-q5_1.bin
      - run: flutter pub get
      - run: flutter analyze

  phone-test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Placeholder assets (git-ignored; analyze and tests only need the paths)
        run: |
          mkdir -p assets/viz/vendor assets/viz/fonts assets/models
          touch assets/models/ggml-small-q5_1.bin
      - run: flutter pub get
      - run: flutter test
