name: Feature request
description: An idea for Notchling.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Notchling shows your Claude Code, Codex and Antigravity sessions in the notch and in Chat, across your own Macs and Linux machines, keeps the Mac awake and switches accounts. What it will never do is in [docs/goals.md](https://github.com/dtthaison/notchling/blob/main/docs/goals.md). Please open this before writing code, so we can agree it fits.
  - type: textarea
    id: moment
    attributes:
      label: The moment you wished for it
      description: What were you doing when this would have helped?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: textarea
    id: agent
    attributes:
      label: For an agent
      description: Every feature works for an agent too, with a `notchling` command. What would an agent run, and where would you agree to it (an Inbox or Ask card)? Leave empty if unsure.
