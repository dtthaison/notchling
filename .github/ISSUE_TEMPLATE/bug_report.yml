name: Bug report
description: Something in Notchling doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste tokens, cookies or the contents of `~/.claude.json`. For security problems, use [SECURITY.md](https://github.com/dtthaison/notchling/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start two background agents with `claude --bg`
        2. Open Chat and pick the second session
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and display
      placeholder: MacBook Pro 14" (notch), plus an external display
  - type: input
    id: notchling
    attributes:
      label: Notchling version
      description: Output of `notchling --version`.
      placeholder: notchling 2.0.0 (1a2b3c4d5e6f)
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: Tool versions
      description: The tools involved, from `claude --version`, `codex --version` or `agy --version`.
      placeholder: Claude Code 2.1.324
  - type: dropdown
    id: where
    attributes:
      label: Where it happened
      multiple: true
      options:
        - This Mac
        - Another Mac in the cluster
        - A Linux machine
        - The phone app
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Notch
        - Chat
        - Answering prompts (hook)
        - Replying to sessions
        - Inbox and Ask
        - Accounts and limits
        - Cluster and Machines
        - Secret Vault
        - Codex or Antigravity
        - Keep awake
        - Phone app
        - notchling command line
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Logs help, `~/Library/Application Support/Notchling/notchlingd.log` and `logs/crash.log` there. Check them for tokens before pasting.
