name: rust

# The Rust workspace (crates/): tests on three systems, clippy, and cargo-deny (licenses, advisories,
# sources). No `paths:` filter: rust-test, rust-clippy and rust-deny are required checks on main, and
# a filtered workflow never reports on a pull request that touches no Rust. The toolchain comes from
# rust-toolchain.toml (rustup is on the runners); no third-party actions.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  rust-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo test --workspace --locked

  # One required check for the whole matrix: it fails unless every system passed.
  rust-test:
    needs: rust-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every system passed
        env:
          RESULT: ${{ needs.rust-matrix.result }}
        run: |
          echo "rust-matrix: $RESULT"
          test "$RESULT" = "success"

  rust-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - run: cargo deny check
