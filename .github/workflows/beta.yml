name: Beta

# Cuts a Beta: a daily run (or a click) builds the app from the default branch, signs and notarizes it,
# attests it, publishes the prerelease `vX.Y.Z-beta.N` and adds it to the update feed. Stable is
# promote.yml: the same files, never a rebuild. OFF until the maintainer sets the repository variable
# NOTCHLING_RELEASES to `on` (a missing variable counts as off) and the `release` environment holds
# the signing secrets; the old flow (legacy/macos/release.sh -> release.yml) keeps working until then.
#
# Build, then sign apart. Four jobs, each with only what it needs:
#   gate     reads the default branch (no secrets, contents: read): kill switch, the next tag.
#   build    runs the repository's code with no secrets and no write token; uploads the unsigned app,
#            its SHA-256 and the release notes. Its hash also goes to the next job as a job output,
#            which travels apart from the artifact, so a changed artifact is caught.
#   sign     runs NO repository code: no checkout, only pinned actions and the shell in this file. It has
#            the signing secrets and no write token on the repository. It checks the hash, signs with
#            Developer ID, notarizes, staples, signs the update with Sparkle's sign_update (downloaded
#            by a pinned URL and SHA-256), attests the files and uploads them.
#   publish  has the write token and the default branch's tools/release/appcast.py but no signing
#            secrets: it creates the prerelease with the signed files and updates the feed.
#
# The feed is the asset `appcast.xml` of the release tagged `appcast` (a prerelease, never "latest").
# The app's feed URL is https://github.com/<owner>/<repo>/releases/download/appcast/appcast.xml.
# Runs queue in one group so two never edit the feed at once.
#
# Setup the maintainer does once (docs/policies/automation.md): create the `release` environment,
# restrict its deployment branches to the default branch, and keep APPLE_CERT_P12 (base64 of the
# Developer ID Application .p12), APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
# and SPARKLE_ED_PRIVATE_KEY there as environment secrets, never as repository secrets: a branch's
# own copy of this file could otherwise read them. A missing secret fails the sign job closed.
# Event fields reach the shell only through `env:`.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      allow_breaking:
        description: "Allow a breaking change in this Beta (maintainer only)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: notchling-release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
      last: ${{ steps.decide.outputs.last }}
    steps:
      - name: Kill switch
        env:
          NOTCHLING_RELEASES: ${{ vars.NOTCHLING_RELEASES }}
        run: |
          [ "$NOTCHLING_RELEASES" = "on" ] || { echo "Releases are off: set the repository variable NOTCHLING_RELEASES to on."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.triggering_actor }}
          ALLOW_BREAKING: ${{ inputs.allow_breaking }}
          PYTHONPATH: tools/guard
        run: |
          set -euo pipefail
          # A click on another branch would run that branch's copy of this file; only the default branch counts.
          [ "$RUN_REF" = "refs/heads/$DEFAULT_BRANCH" ] || { echo "Betas are cut from $DEFAULT_BRANCH only."; exit 1; }
          flag=""
          if [ "$ALLOW_BREAKING" = "true" ]; then
            python3 -c 'import os, sys; from guard.gate import MAINTAINERS; sys.exit(0 if os.environ["ACTOR"] in MAINTAINERS else 1)' \
              || { echo "Only a maintainer may allow a breaking change."; exit 1; }
            flag="--allow-breaking"
          fi
          sha="$(git rev-parse HEAD)"
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ "$EVENT_NAME" = "schedule" ] && [ -n "$last" ] && [ "$(git rev-list --count "$last..HEAD")" = "0" ]; then
            echo "No merges since $last: no Beta today."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuses (non-zero) a breaking fragment without --allow-breaking.
          tag="$(python3 tools/release/version.py next --channel beta $flag)"
          printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' || { echo "Bad Beta tag: $tag"; exit 1; }
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || { echo "Bad commit"; exit 1; }
          { echo "run=true"; echo "tag=$tag"; echo "sha=$sha"; echo "last=$last"; } >> "$GITHUB_OUTPUT"
          echo "Next Beta: $tag at $sha (last tag: ${last:-none})"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    # Repository code runs here, so: a read-only token and no secrets.
    permissions:
      contents: read
    outputs:
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    steps:
      - name: Kill switch
        env:
          NOTCHLING_RELEASES: ${{ vars.NOTCHLING_RELEASES }}
        run: |
          [ "$NOTCHLING_RELEASES" = "on" ] || { echo "Releases are off: set the repository variable NOTCHLING_RELEASES to on."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build the app
        # No --dmg: the disk image is made in the sign job, from the signed app.
        run: ./build.sh
      - name: Write the version into the built copy
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: python3 tools/release/version.py plist build/Notchling.app "$TAG"
      - name: Package
        id: package
        env:
          LAST_TAG: ${{ needs.gate.outputs.last }}
        run: |
          set -euo pipefail
          mkdir dist
          ditto -c -k --keepParent build/Notchling.app dist/Notchling-unsigned.zip
          if [ -n "$LAST_TAG" ]; then
            python3 tools/release/fragments.py notes --since "$LAST_TAG" > dist/notes.md
          else
            python3 tools/release/fragments.py notes > dist/notes.md
          fi
          (cd dist && shasum -a 256 Notchling-unsigned.zip notes.md > SHA256SUMS)
          echo "zip_sha256=$(shasum -a 256 dist/Notchling-unsigned.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [gate, build]
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    # No checkout in this job and no write token on the repository: only the attestation's own rights.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Kill switch
        env:
          NOTCHLING_RELEASES: ${{ vars.NOTCHLING_RELEASES }}
        run: |
          [ "$NOTCHLING_RELEASES" = "on" ] || { echo "Releases are off: set the repository variable NOTCHLING_RELEASES to on."; exit 1; }
      - name: Require the signing secrets
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=0
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Not signing without every secret."; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned
          path: in
      - name: Verify the unsigned files
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          EXPECTED_ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' || { echo "Bad tag"; exit 1; }
          printf '%s' "$EXPECTED_ZIP_SHA256" | grep -Eq '^[0-9a-f]{64}$' || { echo "Bad hash from the build job"; exit 1; }
          cd in
          shasum -a 256 -c SHA256SUMS
          got="$(shasum -a 256 Notchling-unsigned.zip | cut -d' ' -f1)"
          [ "$got" = "$EXPECTED_ZIP_SHA256" ] || { echo "The artifact is not the one the build job made."; exit 1; }
      - name: Sign, notarize and staple
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          WORK="$RUNNER_TEMP/work"
          KEYCHAIN="$RUNNER_TEMP/notchling-sign.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          rm -rf "$WORK" && mkdir -p "$WORK" out
          ditto -x -k in/Notchling-unsigned.zip "$WORK"
          APP="$WORK/Notchling.app"
          [ -d "$APP" ] || { echo "No Notchling.app in the archive."; exit 1; }
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          case "$VERSION" in "$SHORT"*) ;; *) echo "The app says $SHORT, the tag says $VERSION."; exit 1;; esac

          # A temporary keychain for the certificate; the cleanup step deletes it.
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENT="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          [ -n "$IDENT" ] || { echo "No Developer ID Application identity in the certificate."; exit 1; }

          # Inside out: the helper, then the app. Sparkle's own nested code gets its step in the PR that adds Sparkle.
          codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$IDENT" "$APP/Contents/Helpers/agent-console-hostd"
          codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$IDENT" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # The disk image holds the signed app; Apple notarizes the image, which covers the app inside it.
          DMG="out/Notchling-$VERSION.dmg"
          mkdir "$WORK/dmg"
          cp -R "$APP" "$WORK/dmg/"
          ln -s /Applications "$WORK/dmg/Applications"
          hdiutil create -volname Notchling -srcfolder "$WORK/dmg" -ov -format UDZO "$DMG" > /dev/null
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENT" "$DMG"

          xcrun notarytool store-credentials notchling-release --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN" > /dev/null
          xcrun notarytool submit "$DMG" --keychain-profile notchling-release --keychain "$KEYCHAIN" --wait --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$RUNNER_TEMP/notary.json")"
          if [ "$status" != "Accepted" ]; then
            id="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$RUNNER_TEMP/notary.json")"
            [ -z "$id" ] || xcrun notarytool log "$id" --keychain-profile notchling-release --keychain "$KEYCHAIN" || true
            echo "Notarization status: $status"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$DMG"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "out/Notchling-$VERSION.zip"
          cp "$APP/Contents/Info.plist" "$WORK/Info.plist"
          {
            echo "BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WORK/Info.plist")"
            echo "SHORT_VERSION=$SHORT"
            echo "MIN_SYSTEM=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$WORK/Info.plist")"
          } > "$RUNNER_TEMP/info.env"
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/notchling-sign.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Fetch Sparkle's sign_update
        # Pinned: Sparkle 2.9.6 (the app needs 2.6.4 or later). The hash is checked before anything is unpacked.
        env:
          SPARKLE_VERSION: "2.9.6"
          SPARKLE_SHA256: 52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sparkle"
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL -o "$dir/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $dir/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$dir/sparkle.tar.xz" -C "$dir" ./bin/sign_update
          test -x "$dir/bin/sign_update"
      - name: Sign the update
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DMG="out/Notchling-$VERSION.dmg"
          # The feed's enclosure is the disk image (appcast.py's contract), signed after stapling.
          # The key goes to sign_update's standard input only.
          SIG="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - -p "$DMG")"
          printf '%s' "$SIG" | grep -Eq '^[A-Za-z0-9+/]{86}==$' || { echo "sign_update gave no EdDSA signature."; exit 1; }
          {
            cat "$RUNNER_TEMP/info.env"
            echo "TAG=$TAG"
            echo "DMG_NAME=Notchling-$VERSION.dmg"
            echo "DMG_LENGTH=$(stat -f%z "$DMG")"
            echo "ED_SIGNATURE=$SIG"
          } > out/release-info.env
          cp in/notes.md out/notes.md
          (cd out && shasum -a 256 "Notchling-$VERSION.dmg" "Notchling-$VERSION.zip" release-info.env notes.md > SHA256SUMS)
          cat out/release-info.env
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            out/Notchling-*.dmg
            out/Notchling-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [gate, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment `release` brings the deployment-branch rule; this job reads no secret.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Kill switch
        env:
          NOTCHLING_RELEASES: ${{ vars.NOTCHLING_RELEASES }}
        run: |
          [ "$NOTCHLING_RELEASES" = "on" ] || { echo "Releases are off: set the repository variable NOTCHLING_RELEASES to on."; exit 1; }
      # Only the default branch's tools/release/appcast.py runs here, and no signing secret is in reach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed
          path: signed
      - name: Verify and read the release info
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' || { echo "Bad tag"; exit 1; }
          cd signed
          sha256sum -c SHA256SUMS
          get() { grep -E "^$1=" release-info.env | head -1 | cut -d= -f2-; }
          bundle="$(get BUNDLE_VERSION)"; short="$(get SHORT_VERSION)"; minsys="$(get MIN_SYSTEM)"
          sig="$(get ED_SIGNATURE)"; length="$(get DMG_LENGTH)"; dmg="$(get DMG_NAME)"; itag="$(get TAG)"
          printf '%s' "$bundle" | grep -Eq '^[0-9]+$' || { echo "Bad BUNDLE_VERSION"; exit 1; }
          printf '%s' "$short" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' || { echo "Bad SHORT_VERSION"; exit 1; }
          printf '%s' "$minsys" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' || { echo "Bad MIN_SYSTEM"; exit 1; }
          printf '%s' "$sig" | grep -Eq '^[A-Za-z0-9+/]{86}==$' || { echo "Bad ED_SIGNATURE"; exit 1; }
          printf '%s' "$length" | grep -Eq '^[0-9]+$' || { echo "Bad DMG_LENGTH"; exit 1; }
          [ "$dmg" = "Notchling-${TAG#v}.dmg" ] || { echo "Bad DMG_NAME"; exit 1; }
          [ "$itag" = "$TAG" ] || { echo "The signed files are for $itag, not $TAG."; exit 1; }
          [ "$(stat -c%s "$dmg")" = "$length" ] || { echo "The disk image is not $length bytes."; exit 1; }
          {
            echo "BUNDLE_VERSION=$bundle"; echo "SHORT_VERSION=$short"; echo "MIN_SYSTEM=$minsys"
            echo "ED_SIGNATURE=$sig"; echo "DMG_LENGTH=$length"; echo "DMG_NAME=$dmg"
          } >> "$GITHUB_ENV"
      - name: Create the prerelease
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "Bad commit"; exit 1; }
          VERSION="${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run after a later step failed: carry on only if the release holds the same disk image.
            mkdir existing
            gh release download "$TAG" --pattern "$DMG_NAME" --dir existing
            [ "$(sha256sum "existing/$DMG_NAME" | cut -d' ' -f1)" = "$(sha256sum "signed/$DMG_NAME" | cut -d' ' -f1)" ] \
              || { echo "$TAG exists with different files."; exit 1; }
            echo "$TAG already published."
          else
            gh release create "$TAG" "signed/$DMG_NAME" "signed/Notchling-$VERSION.zip" signed/SHA256SUMS signed/release-info.env signed/notes.md \
              --target "$SHA" --prerelease --title "Notchling $VERSION" --notes-file signed/notes.md
          fi
      - name: Update the feed
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir feed
          have_feed=0
          if gh release view appcast > /dev/null 2>&1; then
            have_feed=1
            gh release download appcast --pattern appcast.xml --dir feed
          fi
          # appcast.py add starts a new feed when the file is missing.
          python3 tools/release/appcast.py add --feed feed/appcast.xml \
            --version "$BUNDLE_VERSION" --short "$SHORT_VERSION" \
            --url "https://github.com/$GH_REPO/releases/download/$TAG/$DMG_NAME" \
            --length "$DMG_LENGTH" --ed-signature "$ED_SIGNATURE" --min-system "$MIN_SYSTEM" \
            --notes-url "https://github.com/$GH_REPO/releases/tag/$TAG" --channel beta
          python3 tools/release/appcast.py verify --feed feed/appcast.xml
          if [ "$have_feed" = "1" ]; then
            gh release upload appcast feed/appcast.xml --clobber
          else
            gh release create appcast feed/appcast.xml --target "$SHA" --prerelease \
              --title "Update feed" --notes "The Sparkle feed (appcast.xml). Edited by the release workflows; do not delete."
          fi
