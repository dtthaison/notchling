[package]
name = "notchling-kit"
description = "Notchling kit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The tokens (colors, type, metrics, motion, icons) have no dependencies and are tested on every
# system. GPUI is macOS only for now: Linux needs system libraries CI doesn't install yet, and
# Windows is unverified (LINT-GPUI-MACOS-ONLY).
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
