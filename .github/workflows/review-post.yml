name: Review post

# The trusted half of the review agent. It runs after "Review run" finishes (workflow_run), with a
# token that can write a commit status and a comment, so it runs only the default branch's code: the
# checkout names it (`ref:` is the repository's default branch), the PR head is never fetched or run,
# and tools/agents/review.py reads the diff and the check results through the API. Event fields reach
# the shell only through `env:`.
#
# It reviews a PR only when it is the App's (login in the repository variable AGENT_APP_LOGIN) or a
# maintainer labeled it `notchling:review`; review.py decides that, so stranger PRs cost nothing.
# It posts the `review-agent` commit status on the head and one comment. The status is `success` only
# when the verdict is "merge", and that is a recommendation: nothing here approves, requests reviews on
# or merges a PR. A missing key, a model error or an unreadable answer is a `failure` ("review missing").
#
# review-agent is recommend-only for now: it is NOT added to the required checks in .github/rulesets.
# Adding it there is a decision for the maintainer, after the agent has agreed with him on enough PRs.
#
# Needs the repository secret ANTHROPIC_API_KEY (without it every review is "review missing") and,
# for App PRs, the repository variable AGENT_APP_LOGIN.
on:
  workflow_run:
    workflows: ["Review run"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  statuses: write

# Runs for one head commit queue instead of cancelling each other: a run cancelled after it asked the
# model, before it wrote the comment that records that, would make the next one ask again.
concurrency:
  group: review-post-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
      RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AGENT_APP_LOGIN: ${{ vars.AGENT_APP_LOGIN }}
      REVIEW_DAILY_CAP: ${{ vars.REVIEW_DAILY_CAP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Find the pull request
        id: pr
        run: |
          set -euo pipefail
          n="$(printf '%s' "${RUN_PRS:-[]}" | python3 -c 'import json,sys; p=json.load(sys.stdin) or []; print(p[0]["number"] if p else "")')"
          if [ -z "$n" ]; then
            # Fork PRs aren't listed on workflow_run; look the head commit up instead.
            n="$(gh api "repos/$GH_REPO/commits/$RUN_HEAD/pulls" --jq '.[0].number // empty')"
          fi
          if [ -z "$n" ]; then
            echo "no pull request for this event: nothing to review"
            exit 0
          fi
          case "$n" in *[!0-9]*) echo "bad PR number"; exit 1;; esac
          { echo "post=true"; echo "number=$n"; } >> "$GITHUB_OUTPUT"
      - name: Review
        if: steps.pr.outputs.post == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/agents/review.py
