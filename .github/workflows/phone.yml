name: phone

# No `paths:` filter: phone-analyze and phone-test are required checks on main, and a filtered
# workflow never reports on a pull request that touches nothing under apps/flutter/, so it would wait forever.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  phone-analyze:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Placeholder assets (git-ignored; analyze and tests only need the paths)
        run: |
          mkdir -p assets/viz/vendor assets/viz/fonts assets/models
          touch assets/models/ggml-small-q5_1.bin
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: git diff --exit-code -- lib/l10n
      - run: flutter analyze

  phone-test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Placeholder assets (git-ignored; analyze and tests only need the paths)
        run: |
          mkdir -p assets/viz/vendor assets/viz/fonts assets/models
          touch assets/models/ggml-small-q5_1.bin
      - run: flutter pub get
      - run: flutter test
