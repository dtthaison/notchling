name: Tests

# Tests only. The app and its disk image are built by release.yml, when a release/<version> pull
# request is merged and v<version> is tagged.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: swift test
