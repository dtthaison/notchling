[package]
name = "notchling-notchlingd"
description = "Notchling notchlingd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# One binary, `notchling`: `daemon` serves, the other subcommands are its clients.
[[bin]]
name = "notchling"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notchling-cluster-net = { path = "../cluster-net" }
notchling-engine = { path = "../engine", features = ["static-embed"] }
notchling-events = { path = "../events" }
notchling-local-api = { path = "../local-api" }
notchling-locale = { path = "../locale" }
notchling-platform = { path = "../platform" }
hmac = "0.12"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A test certificate in the Swift app's PKCS#12 layout, for the bridge ops' tests.
[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
p12 = "0.6.3"
