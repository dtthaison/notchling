name: Triage

# A new issue gets a type label and, when something is missing, a templated comment. A model reads
# the issue and answers JSON; tools/agents/triage.py validates that answer and applies it. See
# docs/policies/automation.md ("Triage").
#
# Safety: two jobs, so the model and the write token never meet.
#   classify: `permissions: {}`. It holds the model key and no GitHub token. The issue text reaches
#     the script only through `env:`, is fenced as data in the prompt, and what leaves the job is a
#     plan the script validated (labels from tools/agents/triage_labels.json, a fixed comment id).
#   label: `issues: write`. It holds the token and no model key. It re-validates the plan, then only
#     adds labels and posts one comment built from fixed text. It never closes an issue, never adds
#     a `notchling:*` label and never repeats the issue's text.
# Both run the default branch's code. Without ANTHROPIC_API_KEY, or on any model error or answer that
# isn't exactly the expected shape, the plan is empty and nothing happens.
on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      plan: ${{ steps.parse.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Build the request
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
        run: |
          set -euo pipefail
          python3 tools/agents/triage.py prompt > "$RUNNER_TEMP/request.json"
      - name: Ask the model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/answer.txt"
          if ! python3 tools/agents/triage.py ask < "$RUNNER_TEMP/request.json" > "$RUNNER_TEMP/answer.txt"; then
            echo "::warning::the model call failed; triage does nothing for this issue"
            : > "$RUNNER_TEMP/answer.txt"
          fi
      - name: Validate the answer into a plan
        id: parse
        run: |
          set -euo pipefail
          python3 tools/agents/triage.py parse < "$RUNNER_TEMP/answer.txt" > "$RUNNER_TEMP/plan.json"
          { printf 'plan='; cat "$RUNNER_TEMP/plan.json"; } >> "$GITHUB_OUTPUT"

  label:
    needs: classify
    if: needs.classify.outputs.plan != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Apply the plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN: ${{ needs.classify.outputs.plan }}
        run: |
          set -euo pipefail
          python3 tools/agents/triage.py apply
