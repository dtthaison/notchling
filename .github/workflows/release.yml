name: Release

# Merging a release/<version> pull request (made by tools/release/release.py) tags v<version> on the merge
# commit and publishes the GitHub release: the Mac app as a disk image and a zip, the two Linux node
# binaries with their manifest.json, and SHA256SUMS over all of them. It then adds the version to the
# update feed as a Stable item. Nothing is signed or notarized (the app is ad hoc signed, as
# tools/bundle-next.sh builds it) and no secret is used: only the workflow's own token.
#
# Four jobs, each with only what it needs:
#   gate     reads the merge commit (contents: read): the version comes from Cargo.toml, and the branch
#            name, the CHANGELOG section and the missing tag must all agree with it.
#   app      builds the Mac app with tools/bundle-next.sh on macOS (contents: read) and packages it.
#   nodes    builds the Linux binaries with tools/build-node.sh on Linux (contents: read), zig and
#            cargo-zigbuild pinned as rust.yml's node-builds job has them.
#   publish  the only job with contents: write. It checks every file against the hashes the other jobs
#            gave as job outputs (they travel apart from the artifacts), requires the manifest's build
#            id to be the app's, then creates the release and updates the feed.
#
# The feed is the asset `appcast.xml` of the release tagged `appcast` (a prerelease, never "latest").
# Runs queue in one group, so two never edit the feed at once. Event fields reach the
# shell only through `env:`.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

concurrency:
  group: notchling-release
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.event.outputs.sha }}
    steps:
      - name: Read the event
        id: event
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [[ $MERGE_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "Bad merge commit"; exit 1; }
          [[ $HEAD_REF =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad release branch: $HEAD_REF"; exit 1; }
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.event.outputs.sha }}
          persist-credentials: false
      - name: Check the version
        id: check
        env:
          SHA: ${{ steps.event.outputs.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "The checkout is not the merge commit."; exit 1; }
          version="$(awk '/^\[/ { in_ws = ($0 == "[workspace.package]") } in_ws && $1 == "version" { print $3; exit }' Cargo.toml)"
          version="${version//\"/}"
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version in Cargo.toml: $version"; exit 1; }
          [ "$HEAD_REF" = "release/$version" ] || { echo "The branch is $HEAD_REF, Cargo.toml says $version."; exit 1; }
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1 } END { exit !found }' CHANGELOG.md \
            || { echo "CHANGELOG.md has no section for $version."; exit 1; }
          if err="$(gh api "repos/$GH_REPO/git/ref/tags/v$version" 2>&1 > /dev/null)"; then
            echo "v$version already exists."
            exit 1
          fi
          case "$err" in *"HTTP 404"*) ;; *) echo "Could not check for the tag: $err"; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version at $SHA"

  app:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      build: ${{ steps.package.outputs.build }}
      dmg_sha256: ${{ steps.package.outputs.dmg_sha256 }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Build the app
        run: tools/bundle-next.sh
      - name: Check and package
        id: package
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version"; exit 1; }
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "Bad commit"; exit 1; }
          APP=build/next/Notchling.app
          [ -d "$APP" ] || { echo "No $APP."; exit 1; }
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          [ "$short" = "$VERSION" ] || { echo "The app says $short, the release is $VERSION."; exit 1; }
          git diff --quiet HEAD || { echo "The tree is dirty: the build id would say so."; exit 1; }
          build="$(git rev-parse --short=12 HEAD)"
          [[ $build =~ ^[0-9a-f]{12,40}$ ]] || { echo "Bad build id: $build"; exit 1; }
          case "$SHA" in "$build"*) ;; *) echo "The build id is not the start of the commit."; exit 1;; esac
          mkdir dist dmg-src
          ditto "$APP" dmg-src/Notchling.app
          ln -s /Applications dmg-src/Applications
          hdiutil create -volname Notchling -srcfolder dmg-src -ov -format UDZO "dist/Notchling-$VERSION.dmg" > /dev/null
          ditto -c -k --keepParent "$APP" "dist/Notchling-$VERSION.zip"
          {
            echo "build=$build"
            echo "dmg_sha256=$(shasum -a 256 "dist/Notchling-$VERSION.dmg" | cut -d' ' -f1)"
            echo "zip_sha256=$(shasum -a 256 "dist/Notchling-$VERSION.zip" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac
          path: dist/
          if-no-files-found: error
          retention-days: 7

  nodes:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_ZIGBUILD_VERSION: "0.24.1"
      ZIG_VERSION: "0.16.0"
      ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
    outputs:
      build: ${{ steps.collect.outputs.build }}
      x86_64_sha256: ${{ steps.collect.outputs.x86_64_sha256 }}
      aarch64_sha256: ${{ steps.collect.outputs.aarch64_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Install zig
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - run: cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"
      - run: test "$(zig version)" = "$ZIG_VERSION"
      - name: Build the node binaries
        run: NOTCHLING_DATA_ROOT="$RUNNER_TEMP/data" tools/build-node.sh
      - name: Collect
        id: collect
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/data/notchling/cluster/dist"
          mkdir out
          cp "$dist/notchling-linux-x86_64" "$dist/notchling-linux-aarch64" "$dist/manifest.json" out/
          build="$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["build"])' out/manifest.json)"
          [[ $build =~ ^[0-9a-f]{12,40}$ ]] || { echo "Bad build id in the manifest: $build"; exit 1; }
          python3 -I - out <<'PY'
          import hashlib, json, os, sys
          folder = sys.argv[1]
          files = json.load(open(os.path.join(folder, "manifest.json")))["files"]
          assert sorted(files) == ["notchling-linux-aarch64", "notchling-linux-x86_64"], sorted(files)
          for name, entry in files.items():
              data = open(os.path.join(folder, name), "rb").read()
              assert hashlib.sha256(data).hexdigest() == entry["sha256"], name
              assert len(data) == entry["size"], name
          PY
          {
            echo "build=$build"
            echo "x86_64_sha256=$(sha256sum out/notchling-linux-x86_64 | cut -d' ' -f1)"
            echo "aarch64_sha256=$(sha256sum out/notchling-linux-aarch64 | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nodes
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [gate, app, nodes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mac
          path: mac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nodes
          path: nodes
      - name: Verify the files
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
          APP_BUILD: ${{ needs.app.outputs.build }}
          NODES_BUILD: ${{ needs.nodes.outputs.build }}
          DMG_SHA256: ${{ needs.app.outputs.dmg_sha256 }}
          ZIP_SHA256: ${{ needs.app.outputs.zip_sha256 }}
          X86_64_SHA256: ${{ needs.nodes.outputs.x86_64_sha256 }}
          AARCH64_SHA256: ${{ needs.nodes.outputs.aarch64_sha256 }}
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version"; exit 1; }
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "Bad commit"; exit 1; }
          [[ $APP_BUILD =~ ^[0-9a-f]{12,40}$ ]] || { echo "Bad build id from the app job"; exit 1; }
          [[ $NODES_BUILD =~ ^[0-9a-f]{12,40}$ ]] || { echo "Bad build id from the nodes job"; exit 1; }
          for h in "$DMG_SHA256" "$ZIP_SHA256" "$X86_64_SHA256" "$AARCH64_SHA256"; do
            [[ $h =~ ^[0-9a-f]{64}$ ]] || { echo "Bad hash from a build job"; exit 1; }
          done
          [ "$APP_BUILD" = "$NODES_BUILD" ] || { echo "The app is build $APP_BUILD, the nodes are build $NODES_BUILD."; exit 1; }
          case "$SHA" in "$APP_BUILD"*) ;; *) echo "Build $APP_BUILD is not the start of $SHA."; exit 1;; esac
          [ "$(ls mac | sort | tr '\n' ' ')" = "Notchling-$VERSION.dmg Notchling-$VERSION.zip " ] || { echo "The mac artifact holds unexpected files."; exit 1; }
          [ "$(ls nodes | sort | tr '\n' ' ')" = "manifest.json notchling-linux-aarch64 notchling-linux-x86_64 " ] || { echo "The nodes artifact holds unexpected files."; exit 1; }
          [ "$(sha256sum "mac/Notchling-$VERSION.dmg" | cut -d' ' -f1)" = "$DMG_SHA256" ] || { echo "The disk image is not the one the app job made."; exit 1; }
          [ "$(sha256sum "mac/Notchling-$VERSION.zip" | cut -d' ' -f1)" = "$ZIP_SHA256" ] || { echo "The zip is not the one the app job made."; exit 1; }
          [ "$(sha256sum nodes/notchling-linux-x86_64 | cut -d' ' -f1)" = "$X86_64_SHA256" ] || { echo "The x86_64 binary is not the one the nodes job made."; exit 1; }
          [ "$(sha256sum nodes/notchling-linux-aarch64 | cut -d' ' -f1)" = "$AARCH64_SHA256" ] || { echo "The aarch64 binary is not the one the nodes job made."; exit 1; }
          python3 -I - nodes "$NODES_BUILD" <<'PY'
          import hashlib, json, os, sys
          folder, build = sys.argv[1], sys.argv[2]
          manifest = json.load(open(os.path.join(folder, "manifest.json")))
          assert manifest["build"] == build, manifest["build"]
          assert sorted(manifest["files"]) == ["notchling-linux-aarch64", "notchling-linux-x86_64"]
          for name, entry in manifest["files"].items():
              assert hashlib.sha256(open(os.path.join(folder, name), "rb").read()).hexdigest() == entry["sha256"], name
          PY
          mkdir assets
          cp "mac/Notchling-$VERSION.dmg" "mac/Notchling-$VERSION.zip" nodes/notchling-linux-x86_64 nodes/notchling-linux-aarch64 nodes/manifest.json assets/
          (cd assets && sha256sum "Notchling-$VERSION.dmg" "Notchling-$VERSION.zip" notchling-linux-x86_64 notchling-linux-aarch64 manifest.json > SHA256SUMS)
          cat assets/SHA256SUMS
      - name: Write the release notes
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version"; exit 1; }
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^(## |\[)/ { exit } on { print }' CHANGELOG.md > changes.md
          grep -q '[^[:space:]]' changes.md || { echo "The CHANGELOG section for $VERSION is empty."; exit 1; }
          {
            cat changes.md
            cat <<EOF

          ## Install

          **Mac** (Apple silicon, macOS 13 or later)

          1. Download **Notchling-$VERSION.dmg**, open it and drag **Notchling** onto **Applications**.
          2. The app isn't notarized, so macOS blocks it the first time you open it. Open **System Settings > Privacy & Security**, scroll down to "Notchling was blocked" and click **Open Anyway**. Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/Notchling.app\`

          The zip holds the same app.

          **Linux machines**

          You don't download these by hand. Add Machine and Update Machines in the app fetch the matching binary from this release and check its SHA-256 against **manifest.json**.

          SHA256SUMS lists every file.
          EOF
          } > notes.md
          cat notes.md
      - name: Create the release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version"; exit 1; }
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "Bad commit"; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            mkdir existing
            gh release download "$TAG" --pattern "Notchling-$VERSION.dmg" --dir existing
            [ "$(sha256sum "existing/Notchling-$VERSION.dmg" | cut -d' ' -f1)" = "$(sha256sum "assets/Notchling-$VERSION.dmg" | cut -d' ' -f1)" ] \
              || { echo "$TAG exists with a different disk image."; exit 1; }
            echo "$TAG already published."
          else
            gh release create "$TAG" "assets/Notchling-$VERSION.dmg" "assets/Notchling-$VERSION.zip" \
              assets/notchling-linux-x86_64 assets/notchling-linux-aarch64 assets/manifest.json assets/SHA256SUMS \
              --target "$SHA" --latest --title "Notchling $VERSION" --notes-file notes.md
          fi
      - name: Update the feed
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "Bad commit"; exit 1; }
          # The same formula as version.py's build_number for a Stable: X*1000000 + Y*10000 + Z*100 + 99.
          re='^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$'
          [[ $VERSION =~ $re ]] || { echo "Bad version"; exit 1; }
          number=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 10000 + 10#${BASH_REMATCH[3]} * 100 + 99))
          mkdir feed
          have_feed=0
          if gh release view appcast > /dev/null 2>&1; then
            have_feed=1
            gh release download appcast --pattern appcast.xml --dir feed
          fi
          if [ "$have_feed" = "1" ] && grep -Fq "<sparkle:version>$number</sparkle:version>" feed/appcast.xml; then
            echo "Version $number is already in the feed."
          else
            length="$(wc -c < "assets/Notchling-$VERSION.dmg" | tr -d ' ')"
            python3 tools/release/appcast.py add --feed feed/appcast.xml \
              --version "$number" --short "$VERSION" \
              --url "https://github.com/$GH_REPO/releases/download/v$VERSION/Notchling-$VERSION.dmg" \
              --length "$length" --unsigned --min-system 13.0 \
              --notes-url "https://github.com/$GH_REPO/releases/tag/v$VERSION" \
              --pub-date now --rollout 0
          fi
          python3 tools/release/appcast.py verify --feed feed/appcast.xml
          if [ "$have_feed" = "1" ]; then
            gh release upload appcast feed/appcast.xml --clobber
          else
            gh release create appcast feed/appcast.xml --target "$SHA" --prerelease \
              --title "Update feed" --notes "The update feed (appcast.xml). Edited by the release workflows; do not delete."
          fi
