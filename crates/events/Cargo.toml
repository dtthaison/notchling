[package]
name = "notchling-events"
description = "Notchling log events: the registry, the envelope and the closed list of field types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# A hashed ref and a salt's id are the first 8 hex of a SHA-256, as the engine's stable ids.
sha2 = "0.10"
# A Seal is a 32-byte keyed hash written as 44 base64 characters.
base64 = "0.22"
# An op id, a boot id and the salt are random bytes from the OS.
getrandom = "0.3"
# The Audit's seal is HMAC-SHA256.
hmac = "0.12"
# The check and the importer read a line's head back.
serde_json = "1"
