[package]
name = "notchling-cluster-net"
description = "Notchling cluster links"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Node links: TLS 1.3 with ring's provider, both ends pinned by certificate fingerprint; rcgen makes
# the node's own certificate once per data folder.
[dependencies]
notchling-platform = { path = "../platform" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
ring = "0.17.14"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
sha2 = "0.10"

# A TLS 1.2 client for the test that the listener refuses it.
[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
