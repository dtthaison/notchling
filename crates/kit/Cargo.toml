[package]
name = "notchling-kit"
description = "Notchling kit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The tokens (colors, type, metrics, motion, icons) and the text editing model are tested on every
# system; the model's one dependency is the grapheme and word segmenter GPUI's text stack already
# locks (the version in Cargo.lock, so no second copy). GPUI is macOS only for now: Linux needs
# system libraries CI doesn't install yet, and Windows is unverified (LINT-GPUI-MACOS-ONLY).
[dependencies]
unicode-segmentation = "=1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
