[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.2"
edition = "2021"
license = "MIT"
publish = false

# GPUI 0.2.2 with one fix (vendor/gpui/NOTCHLING.md): its text element re-truncated the runs it
# had already truncated, and a window resize panicked slicing a string mid-character.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

# Debug and test builds keep file and line numbers for Notchling's crates and drop the rest of the
# debug info, and dependencies carry none: full debug info was most of a 129 GB build folder, and
# it slowed every link. Release builds are not affected.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
